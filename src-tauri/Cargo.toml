[package]
name = "stardust"
version = "0.1.0"
description = "scattered thoughts, gathered"
authors = ["Stardust"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which clashes on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "stardust_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
# Must stay on the same version wry uses, because Tauri hands us its WebView2 controller.
webview2-com = "0.39"
windows-core = "0.62"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
