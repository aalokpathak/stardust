# Publishes the packages committed in release/ as a GitHub Release tagged v<version>.
# Nothing is rebuilt, so the downloads are exactly the files that were pushed. Pushing
# changed packages for a version that is already released replaces its downloads.
name: Release

on:
  push:
    branches: [main, master]
    paths: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"

          # Older builds can still be sitting in release/ after a version bump.
          shopt -s nullglob
          packages=(release/*_"$version"_*)
          if [ "${#packages[@]}" -ne 3 ]; then
            echo "::error::Expected 3 packages for $version in release/, found ${#packages[@]}. Run npm run dist."
            exit 1
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${packages[@]}" --clobber
            echo "Updated the downloads on $tag."
          else
            gh release create "$tag" "${packages[@]}" \
              --target "$GITHUB_SHA" \
              --title "Stardust $tag" \
              --generate-notes \
              --notes "Download the \`setup.exe\` or \`.msi\` to install, or the \`portable.exe\` to run without installing. Builds aren't code-signed yet, so Windows SmartScreen may ask you to confirm."
          fi
